<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sideby · 16-second tutorial</title><style>body{max-width:1120px;margin:40px auto;padding:0 24px;font-family:system-ui;background:#101216;color:#f1eee8;line-height:1.7}img{width:100%;height:auto;border-radius:12px}button,a{font:inherit;color:inherit}button{padding:10px 18px;border:1px solid #65758c;border-radius:8px;background:#252d39;cursor:pointer}button[aria-pressed=true]{background:#245caa}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}a:focus-visible,button:focus-visible{outline:3px solid #88baff;outline-offset:3px}p{color:#bcc5d1}</style><a href="preview.html">Sideby · 홍보 영상 / Promotional film</a><h1 id="title">16초로 보는 사용법</h1><p id="intro">두 모니터에서 끌어 연결 완성 → 연결 수정 → ⌥⇧Space에서 지금 화면 추가 → 다른 연결로 이동 → ⌥⇧Tab으로 복귀</p><div class="controls"><button id="ko" aria-pressed="true">한국어</button><button id="en" aria-pressed="false">English</button><button id="play" aria-pressed="false" aria-controls="film">재생</button></div><img id="film" src="../images/sideby-tutorial-ko.png" width="1920" height="1080" alt="Sideby 사용법 영상"><p id="note">실제 앱 UI에 가상 데이터를 넣어 렌더링했습니다. 포인터와 연결 상태 변화는 설명을 위해 재구성했습니다. 기존 Space를 연결하고 전환하며 앱·창 상태를 복원하는 기능은 아닙니다.</p><script>let lang='ko',playing=false;const $=id=>document.getElementById(id);function update(){document.documentElement.lang=lang;const ko=lang==='ko';$('title').textContent=ko?'16초로 보는 사용법':'How to use Sideby in 16 seconds';$('intro').textContent=ko?'두 모니터에서 끌어 연결 완성 → 연결 수정 → ⌥⇧Space에서 지금 화면 추가 → 다른 연결로 이동 → ⌥⇧Tab으로 복귀':'Drag from two displays to connect → Adjust → ⌥⇧Space to connect current Spaces → Switch → ⌥⇧Tab to return';$('note').textContent=ko?'실제 앱 UI에 가상 데이터를 넣어 렌더링했습니다. 포인터와 연결 상태 변화는 설명을 위해 재구성했습니다. 기존 Space를 연결하고 전환하며 앱·창 상태를 복원하는 기능은 아닙니다.':'Actual app UI with fictional data. Pointer and connection state changes are reconstructed examples. Sideby connects existing Spaces; it does not restore app or window state.';$('film').src=`../images/sideby-tutorial-${lang}.${playing?'gif':'png'}`;$('film').alt=ko?'두 모니터 연결 설정, 드래그, 현재 화면 연결 추가, 이동과 복귀를 보여 주는 사용법 영상':'Tutorial showing two-display setup, dragging, connecting current Spaces, switching and returning';$('play').textContent=ko?(playing?'정지':'재생'):(playing?'Stop':'Play');$('play').setAttribute('aria-pressed',String(playing));for(const l of ['ko','en'])$(l).setAttribute('aria-pressed',String(l===lang));}for(const l of ['ko','en'])$(l).onclick=()=>{lang=l;playing=false;update();};$('play').onclick=()=>{playing=!playing;update();};document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;update();}});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches){playing=false;update();}});</script></html>
