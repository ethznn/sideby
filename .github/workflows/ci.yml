name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests and builds
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test public documentation guard
        run: bash scripts/test_check_public_docs.sh

      - name: Check public documentation
        run: bash scripts/check_public_docs.sh

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build Sideby app
        run: swift build --product SidebyApp

      - name: Test Sparkle bundle verifier
        run: bash scripts/test_verify_sparkle_bundle.sh

      - name: Test release metadata validation
        run: bash scripts/test_validate_release_metadata.sh

      - name: Build and verify product bundle
        run: scripts/build_app_bundle.sh

      - name: Build Sideby dev app
        run: swift build --product SidebyDevApp
